name: X-Ray weekly weights

# ADR 0002: once a week, learn the duplicate-match weights from the whole database, test them on
# the admin's ✅/❌ answers, and store the result in D1 xray_weights. The bot keeps the §5.5 rule
# until a later change reads a passed row. On failure the admin chat gets a Telegram message.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xray-weights
  cancel-in-progress: false

jobs:
  weights:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "pydantic>=2.0.0" "pydantic-settings>=2.0.0" "python-dotenv>=1.0.0" "curl_cffi>=0.7.0" "Pillow>=10.0.0"

      - name: Estimate, test and store the weights
        env:
          PYTHONUNBUFFERED: "1"
          CLOUDFLARE_PROXY_URL: ${{ secrets.CLOUDFLARE_PROXY_URL }}
          CLOUDFLARE_SYNC_KEY: ${{ secrets.CLOUDFLARE_SYNC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/estimate_xray_weights.py --out-dir out

      - name: Keep the run's files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray-weights-${{ github.run_id }}
          path: out/
          retention-days: 90
          if-no-files-found: ignore

      - name: Tell the admin on Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ X-Ray: კვირის შეფასება ვერ შესრულდა. ბოტი ძველ წესს იყენებს. ${RUN_URL}"
