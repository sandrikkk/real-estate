name: Real Estate Scraper 24/7

on:
  schedule:
    # დღის აქტიური საათები (თბილისის დროით 08:00 - 22:00 / UTC 04:00 - 18:00): ყოველ 10 წუთში (84 გაშვება დღეში)
    - cron: '*/10 4-17 * * *'
    # ღამის საათები (თბილისის დროით 23:30, 03:30, 06:30 / UTC 19:30, 23:30, 02:30): 3 გაშვება ღამით
    - cron: '30 19,23,2 * * *'
  workflow_dispatch: # საშუალებას გაძლევთ ნებისმიერ დროს ხელითაც გაუშვათ Actions ტაბიდან

permissions:
  contents: write # საჭიროა ნანახი ბინების ბაზის შესანახად

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run 1 Scraping & Telegram Alert Cycle
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || 'REDACTED_TELEGRAM_BOT_TOKEN' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || 'REDACTED_CHAT_ID' }}
          CLOUDFLARE_PROXY_URL: https://your-worker.your-subdomain.workers.dev
        run: |
          python main.py --once

      - name: Commit & Push Seen Listings Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git pull --rebase origin master || true
          if [ -f data/properties.db ]; then
            git add -f data/properties.db
            if ! git diff --staged --quiet; then
              git commit -m "Auto-update seen properties database [skip ci]"
              git push origin master
            else
              echo "No database changes to commit."
            fi
          fi
