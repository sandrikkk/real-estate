name: Real Estate Scraper 24/7

on:
  schedule:
    # დღის აქტიური საათები (თბილისის დროით 08:00 - 00:00 / UTC 04:00 - 20:00): ყოველ 10 წუთში
    - cron: '*/10 4-19 * * *'
    # ღამის საათები (თბილისის დროით 00:00, 02:00, 04:00, 06:00 / UTC 20:00, 22:00, 00:00, 02:00)
    - cron: '0 20,22,0,2 * * *'
  workflow_dispatch: # საშუალებას გაძლევთ ნებისმიერ დროს ხელითაც გაუშვათ Actions ტაბიდან

permissions:
  contents: write # საჭიროა ნანახი ბინების ბაზის შესანახად

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run 1 Scraping & Telegram Alert Cycle
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_PROXY_URL: ${{ secrets.CLOUDFLARE_PROXY_URL }}
          CLOUDFLARE_SYNC_KEY: ${{ secrets.CLOUDFLARE_SYNC_KEY }}
        run: |
          python main.py --once

      - name: Commit & Push Seen Listings Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/properties.db data/seen_ids.txt data/user_seen.json || true
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update seen properties database [skip ci]"
            for i in 1 2 3; do
              git fetch origin master
              git rebase origin/master -X ours || (git rebase --abort 2>/dev/null || true; git merge origin/master -X ours -m "merge remote changes" || true)
              if git push origin master; then
                echo "Successfully committed and pushed updated seen database."
                exit 0
              fi
              echo "Push rejected or conflict, retrying in 3 seconds..."
              sleep 3
            done
            echo "Failed to push after retries, continuing..."
          else
            echo "No database changes to commit."
          fi
