name: Real Estate Scraper 24/7

on:
  schedule:
    # ეშვება ავტომატურად ყოველ 15 წუთში (24/7/365)
    - cron: '*/15 * * * *'
  workflow_dispatch: # საშუალებას გაძლევთ ნებისმიერ დროს ხელითაც გაუშვათ Actions ტაბიდან

permissions:
  contents: write # საჭიროა ნანახი ბინების ბაზის შესანახად

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 1 Scraping & Telegram Alert Cycle
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || 'REDACTED_TELEGRAM_BOT_TOKEN' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || 'REDACTED_CHAT_ID' }}
          CLOUDFLARE_PROXY_URL: https://your-worker.your-subdomain.workers.dev
        run: |
          python main.py --once

      - name: Commit & Push Seen Listings Database
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update seen properties database [skip ci]"
          file_pattern: "data/properties.db"
          skip_dirty_check: false
