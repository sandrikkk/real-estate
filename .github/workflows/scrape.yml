name: Real Estate Scraper 24/7

on:
  schedule:
    # დღის აქტიური საათები (თბილისის დროით 08:00 - 00:00 / UTC 04:00 - 20:00): ყოველ 10 წუთში
    - cron: '*/10 4-19 * * *'
    # ღამის საათები (თბილისის დროით 00:00, 02:00, 04:00, 06:00 / UTC 20:00, 22:00, 00:00, 02:00)
    - cron: '0 20,22,0,2 * * *'
  workflow_dispatch: # საშუალებას გაძლევთ ნებისმიერ დროს ხელითაც გაუშვათ Actions ტაბიდან

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run 1 Scraping & Telegram Alert Cycle
        env:
          PYTHONUNBUFFERED: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_PROXY_URL: ${{ secrets.CLOUDFLARE_PROXY_URL }}
          CLOUDFLARE_SYNC_KEY: ${{ secrets.CLOUDFLARE_SYNC_KEY }}
          USE_CLOUDFLARE_D1: "True"
        run: |
          python main.py --once
