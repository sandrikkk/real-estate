name: Real Estate Scraper Cron

on:
  schedule:
    # ეშვება ყოველ 10 წუთში
    - cron: '*/10 * * * *'
  workflow_dispatch: # საშუალებას გაძლევთ ხელითაც გაუშვათ Actions ტაბიდან

permissions:
  contents: write # საჭიროა ბაზის დასამახსოვრებლად (commit/push)

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 1 Scraping Cycle
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_PROXY_URL: https://your-worker.your-subdomain.workers.dev
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: |
          python tests/test_dry_run.py

      - name: Commit & Push Seen Listings DB
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update seen properties database [skip ci]"
            git pull --rebase origin master
            git push origin master
          else
            echo "No new database changes to commit"
          fi
