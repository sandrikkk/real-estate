name: Photo Hash Benchmark

# Manual, read-only measurement of how well the photo hash finds an edited copy of a listing
# photo (mirror, crop, watermark, Telegram recompression), how the X-Ray photo search does with an
# edited album, and how often re-posters mirror photos. The tables are in the run summary.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Listings to take photos from (default 300)"
        default: "300"
      albums:
        description: "Albums to search with (default 100)"
        default: "100"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install "pydantic>=2.0.0" "pydantic-settings>=2.0.0" "python-dotenv>=1.0.0" "curl_cffi>=0.7.0" "Pillow>=10.0.0" "numpy>=2.0"

      - name: Run the benchmark
        env:
          PYTHONUNBUFFERED: "1"
          CLOUDFLARE_PROXY_URL: ${{ secrets.CLOUDFLARE_PROXY_URL }}
          CLOUDFLARE_SYNC_KEY: ${{ secrets.CLOUDFLARE_SYNC_KEY }}
          USE_CLOUDFLARE_D1: "True"
          LIMIT: ${{ inputs.limit }}
          ALBUMS: ${{ inputs.albums }}
        run: python scripts/diag_photo_live.py
